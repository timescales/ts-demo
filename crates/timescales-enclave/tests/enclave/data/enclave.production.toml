# A production enclave configuration for `config-check --offline`.
# Hosts, paths and pins are placeholders. The committee description next
# to this file is generated by tests/config.rs from fixed labels.
[enclave]
profile = "production"
listen = "0.0.0.0:8090"
ops_listen = "127.0.0.1:9103"
platform = "intel_tdx"
fee_payer_keypair = "/run/secrets/enclave-fee-payer.json"
node_keys = ["3b6a27bcceb6a42d62a3a8d02a6f0d73653215771de243a63ac048a18b59da29"]
member_urls = [
  "https://krc-1.internal:8095",
  "https://krc-2.internal:8095",
  "https://krc-3.internal:8095",
  "https://krc-4.internal:8095",
  "https://krc-5.internal:8095",
]
member_timeout_ms = 5000
post_deadline_ms = 60000
settle_backstop_after_ms = 20000
reveal_backstop_slots = 8
allow_sign_message_grants = false
max_concurrent_executions = 2
max_body_bytes = 16777216
result_cache_entries = 32

[[enclave.market]]
address = "8GLSiyVvwDX9uyNSBTNce75EAwFbuMUFHrcMA3DTg9ZA"
committee_file = "committee-production.bin"
session_domains = ["app.timescales.example"]

[enclave.tls]
cert_file = "/etc/timescales/tls/enclave.crt"
key_file = "/run/secrets/enclave-tls.key"
peer_spki_sha256 = [
  "4d7f3c1b2a5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8",
  "9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a291807f6e5d4c3b2a1908f7e6d5c4b",
]

[enclave.chain]
cluster = "mainnet-beta"
genesis_hash = "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d"
program_id = "FDQqHeaCY2iG9kbjkGGJngY2rgend8dW4JjfXmCQytQL"
rpc_urls = ["https://rpc-one.example.org", "https://rpc-two.example.net"]
rpc_agree = 2
rpc_timeout_ms = 5000
poll_interval_ms = 400

[enclave.chain.priority_fee]
mode = "recent"
fixed_micro_lamports = "1000"
percentile = 75
max_micro_lamports = "200000"

[enclave.telemetry]
log_format = "json"
log_filter = "info"
otlp_endpoint = ""

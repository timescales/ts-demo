[package]
name = "timescales-node"
description = "The node: public API, relay, epoch pipeline, executor quorum and settlement, with the admin tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "timescales-node"
path = "src/main.rs"

[[bin]]
name = "timescales-admin"
path = "src/bin/timescales-admin/main.rs"

[features]
litesvm = ["timescales-chain/litesvm"]
otlp = ["timescales-service/otlp"]
sim-platform = ["timescales-executor/sim-platform"]
test-util = ["timescales-chain/test-util"]

[dependencies]
timescales-auction.workspace = true
timescales-chain = { workspace = true, features = ["rpc-client"] }
timescales-core.workspace = true
timescales-executor = { workspace = true, features = ["tdx-dcap"] }
timescales-service.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
bs58.workspace = true
clap.workspace = true
futures.workspace = true
governor.workspace = true
hex.workspace = true
ipnet.workspace = true
parking_lot.workspace = true
prometheus-client.workspace = true
rand.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
timescales-executor = { workspace = true, features = ["sim-platform", "simulation"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true

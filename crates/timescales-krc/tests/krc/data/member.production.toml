# A production member configuration for `config-check --offline`.
# Hosts, paths and pins are placeholders. The committee description next
# to this file is generated by tests/config.rs from fixed labels.
[member]
profile = "production"
index = 1
listen = "0.0.0.0:8095"
ops_listen = "127.0.0.1:9101"
data_dir = "/var/lib/timescales-krc"
identity_key = "/run/secrets/krc-identity.hex"
transport_key = "/run/secrets/krc-transport.hex"
kek_file = "/run/secrets/krc-kek.keys"

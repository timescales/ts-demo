# A production dealer configuration for `config-check --offline`.
# Hosts, paths and pins are placeholders. The committee description next
# to this file is generated by tests/config.rs from fixed labels.
[dealer]
profile = "production"
data_dir = "/var/lib/timescales-dealer"
identity_key = "/run/secrets/dealer.hex"
lookahead_epochs = 16
interval_ms = 2000
ack_timeout_ms = 5000
node_url = "https://node-internal.example.org:8081"
node_identity = "2b6a1c0e9f8d7c6b5a493827161504f3e2d1c0b9a8f7e6d5c4b3a29180f7e6d5"
ops_listen = "127.0.0.1:9102"
member_urls = [
  "https://krc-1.example.org:8095",
  "https://krc-2.example.net:8095",
  "https://krc-3.example.com:8095",
  "https://krc-4.example.io:8095",
  "https://krc-5.example.dev:8095",
]

[dealer.tls]
cert_file = "/etc/timescales/tls/dealer.crt"
key_file = "/run/secrets/dealer-tls.key"

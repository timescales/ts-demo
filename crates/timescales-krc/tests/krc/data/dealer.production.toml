  "4d7f3c1b2a5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8",
  "9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a291807f6e5d4c3b2a1908f7e6d5c4b",
]

[[dealer.market]]
address = "ksrNGigqNNDU7k7We8gRnWtdz8yL38KaiTcnTvd6X5W"
committee_file = "committee-production.bin"

[dealer.chain]
cluster = "mainnet-beta"
genesis_hash = "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d"
